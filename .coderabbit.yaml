# CodeRabbit configuration file
language: "en-US"
tone_instructions: "Be concise, analytical, and provide actionable feedback focusing on architecture, security, performance, and best practices."
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
chat:
  auto_reply: true
tools:
  ast-grep:
    enabled: true
  shellcheck:
    enabled: true
  typescript:
    enabled: true
